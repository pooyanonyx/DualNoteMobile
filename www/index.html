<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f2937">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>DualNote</title>
<link rel="stylesheet" href="css/app.css">
<script src="lib/jszip.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
</head>
<body>
<div id="app"></div>
<noscript>DualNote needs JavaScript.</noscript>
<script type="module">
  import { start } from "./js/app.js";
  start().catch((e) => { console.error(e); document.body.insertAdjacentHTML("beforeend", "<pre style='padding:1em;color:#b00020'>DualNote could not start: " + String(e && e.message || e) + "</pre>"); });
</script>
</body>
</html>
